services:
  - type: web
    name: bengkel-asoyy
    runtime: node
    plan: free
    buildCommand: "echo ok"
    startCommand: "node start.js"
    healthCheckPath: /api/meta
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: MASTER_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
